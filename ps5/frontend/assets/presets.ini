# PS5SX2's recommended settings: what was tuned and tested on a PS5 Pro (2026-09-25).
#
# The settings page's "Recommended" button writes one section over a settings file:
#   [@global]  -> gs.ini, the defaults every game starts from
#   [<serial>] -> that game's settings/<image name>.ini
# A game without a section gets a file with no values of its own, so it follows gs.ini.
# Lines are the port's ini format (main-boot.cpp orbis_apply_ini_file): key=value, where a bare
# key is in EmuCore/GS; Patches/Enable=<group> repeats, one patch group a line.

[@global]
OverrideTextureBarriers=1
extrathreads=4
# FSR on present, 4x internal resolution.
TVShader=6
upscale_multiplier=4
# MTVU and a 130% EE clock help the heavier games. A game that breaks with them turns them off
# in its own section (Castlevania).
EmuCore/Speedhacks/vuThread=true
EmuCore/Speedhacks/EECycleRate=1
EmuCore/EnableWideScreenPatches=true

[SLUS-20733]
# Castlevania: Lament of Innocence (US)
upscale_multiplier=6
# MTVU freezes this game at the start of a scene (the picture stops, the sound goes on), 2026-09-25.
EmuCore/Speedhacks/vuThread=false
EmuCore/Speedhacks/EECycleRate=0
EmuCore/EnableWideScreenPatches=true

[SCUS-97399]
# God of War (US)
upscale_multiplier=6

[SCUS-97481]
# God of War II (US). PCSX2's own GameDB fixes (half-pixel 5, align sprite, auto flush, native scaling) apply only while
# Manual hardware fixes is off, and full-screen effects (bloom, the Amulet of the Fates) want PS2 texture filtering, so
# neither is set here. The Widescreen 16:9 patch turns on the game's own 16:9 mode; High-Res Mode (a hidden 640x448 mode)
# stays off (2026-10-10 tester report: black bars and the Amulet of the Fates effect broken with it on at 6x).
upscale_multiplier=6
Patches/Enable=Widescreen 16:9

[SCUS-97328]
# Gran Turismo 4 (US)
upscale_multiplier=6

[SLPS-25198]
# Kingdom Hearts Final Mix (English patch)
upscale_multiplier=6
# Cross confirms, Circle cancels.
Patches/Enable=Swap X and O

[SLUS-20520]
# The Lord of the Rings: The Fellowship of the Ring (US)
upscale_multiplier=6
Patches/Enable=60 FPS

[SLUS-20578]
# The Lord of the Rings: The Two Towers (US)
upscale_multiplier=6
Patches/Enable=60 FPS

[SLUS-20770]
# The Lord of the Rings: The Return of the King (US)
upscale_multiplier=6
Patches/Enable=60 FPS

[SLUS-21351]
# Need for Speed: Most Wanted - Black Edition (US)
upscale_multiplier=6

[SLUS-20064]
# Oni (US): 6x ran at 10 fps (about 246 draws a frame read the framebuffer).
upscale_multiplier=4

[SCES-50916]
# Ratchet & Clank (PAL): holds 50 fps at 6x
upscale_multiplier=6

[SCUS-97353]
# Ratchet & Clank 3 (US)
upscale_multiplier=6
